name: Docs (GitHub Pages)

# Publishes the Wyrd III user manual (docs/user, Sphinx) to https://drpaj12.github.io/wyrd/ on every push
# to main. The build is the CI docs job's (warnings are errors); this workflow only adds the deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install Sphinx and extensions
        run: pip install -r requirements-docs.txt
      - name: Build the documentation (warnings are errors)
        run: sphinx-build -W -b html docs/user build/docs
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/docs

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
