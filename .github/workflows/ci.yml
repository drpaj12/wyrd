name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[gui]" "pygame-ce>=2.5,<3" ruff mypy
      - run: ruff check .
      - run: mypy --strict wyrd tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover -s tests -t . -v

  gui:
    # Every test with PySide6 and pygame-ce present in one process: the Qt modules
    # (test_gui_smoke, test_gui_sim, test_gui_midgard, test_midgard_editors, test_midgard_vedit, ...)
    # do not skip, and Qt and SDL share the interpreter as they do for a user.
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install ".[gui]" "pygame-ce>=2.5,<3"
      - run: python -c "import PySide6.QtWidgets, pygame"
      - run: python -X faulthandler -m unittest discover -s tests -t . -v

  sim:
    # Real Odin III tests. odin3 is not on PyPI: set the repository variable ODIN3_WHEEL_URL to the
    # Odin III v1.0.3 release wheel. Without it the tests skip. Not required to pass yet.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - if: vars.ODIN3_WHEEL_URL != ''
        env:
          ODIN3_WHEEL_URL: ${{ vars.ODIN3_WHEEL_URL }}
        run: pip install "$ODIN3_WHEEL_URL"
      - run: python -m unittest tests.test_sim_odin3 -v

  midgard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . "pygame-ce>=2.5,<3"
      - run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python -m unittest tests.test_midgard_ui_basic tests.test_midgard_ui -v

  docs:
    # The user manual (docs/user, Sphinx + MyST). Warnings are errors. Not deployed: GitHub Pages
    # is a repository setting the owner decides on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: sphinx-build -W -b html docs/user build/docs
