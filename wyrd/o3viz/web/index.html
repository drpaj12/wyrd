<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>o3viz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<style>
  :root { color-scheme: dark; --bg:#14171c; --panel:#1d2229; --line:#323a45; --fg:#d8dee6; --dim:#8b96a3; --acc:#ffb454; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:13px/1.35 system-ui, "Segoe UI", sans-serif; overflow:hidden; }
  #app { display:grid; grid-template-columns: 250px 1fr 340px; height:100%; }
  aside { background:var(--panel); padding:10px 12px; overflow:auto; }
  #left { border-right:1px solid var(--line); } #right { border-left:1px solid var(--line); }
  h1 { font-size:15px; margin:0 0 2px; } h2 { font-size:12px; margin:14px 0 4px; color:var(--dim);
    text-transform:uppercase; letter-spacing:.06em; }
  .sub { color:var(--dim); font-size:12px; }
  select, button, input[type=range] { width:100%; margin:2px 0; background:#2a313b; color:var(--fg);
    border:1px solid var(--line); border-radius:4px; padding:3px 4px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--acc); }
  label.row { display:flex; align-items:center; gap:6px; margin:2px 0; }
  label.row input[type=range] { flex:1; width:auto; }
  #stage { position:relative; } #view { position:absolute; inset:0; }
  #tip { position:absolute; pointer-events:none; background:#000c; padding:2px 6px; border-radius:3px;
    font-size:12px; display:none; white-space:nowrap; }
  #legend { margin-top:6px; } #bar { height:12px; border-radius:3px; border:1px solid var(--line); }
  #legend .ends { display:flex; justify-content:space-between; font-size:11px; color:var(--dim); }
  table { border-collapse:collapse; width:100%; font-size:12px; } td { padding:1px 4px; border-bottom:1px solid #2a313b;
    vertical-align:top; word-break:break-all; } td:first-child { color:var(--dim); white-space:nowrap; }
  pre { background:#10131780; border:1px solid var(--line); padding:6px; overflow:auto; font-size:11px;
    max-height:190px; margin:4px 0; } pre .hit { background:#ffb45433; }
  .col { font-size:12px; } .col b { color:var(--acc); } .col div { margin:2px 0; word-break:break-all; }
  .col a { color:#8fc1ff; cursor:pointer; text-decoration:none; } #status { color:var(--dim); font-size:12px; margin-top:8px; }
  .err { color:#ff7b72; }
</style>
</head>
<body>
<div id="app">
  <aside id="left">
    <h1 id="title">o3viz</h1><div class="sub" id="subtitle">loading</div>
    <h2>Colour</h2><select id="colour"></select>
    <div id="legend"><div id="bar"></div><div class="ends"><span id="lo"></span><span id="mid"></span><span id="hi"></span></div>
    <div class="sub" id="unit"></div></div>
    <h2>Size</h2><select id="size"></select>
    <h2>Anchor</h2><select id="anchor"></select>
    <h2>View</h2>
    <label class="row"><input type="checkbox" id="rotate" checked> auto-rotate</label>
    <label class="row">plane gap <input type="range" id="gap" min="2" max="14" step="0.5" value="6"></label>
    <button id="reset">reset camera</button>
    <button id="clear">clear selection</button>
    <h2>Planes</h2><div id="planes"></div>
    <div id="status"></div>
  </aside>
  <div id="stage"><canvas id="view"></canvas><div id="tip"></div></div>
  <aside id="right"><h2 style="margin-top:0">Selection</h2>
    <div id="sel" class="sub">Click a node. Its column through the planes is highlighted.</div></aside>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
