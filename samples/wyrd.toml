[project]
name = "samples"

[[design]]
name = "single"
files = ["designs/single/bm_DL_2_4_encoder.v"]

[[design]]
name = "multi"
files = ["designs/multi/src/arith/adder.v", "designs/multi/src/ctrl/pick.v",
         "designs/multi/src/top.v"]
top = "top"

[[design]]
name = "dsp"
files = ["designs/dsp/buf_ram.v", "designs/dsp/mac.v", "designs/dsp/top.v"]
top = "top"

[recipe.vtr]
steps = [{ use = "odin3-flow", target = "vtr", vpr = true }]

[sweep]
recipe = ["vtr"]
design = ["single", "multi", "dsp"]
arch = ["k6_frac_N10_frac_chain_mem32K_40nm", "EArch"]

[run]
step_timeout = 3600
