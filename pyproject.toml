[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wyrd"
version = "0.1.0"
description = "Experiment runner for Odin III flows (part of Wyrd III)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
wyrd = "wyrd.cli:main"

[tool.setuptools.packages.find]
include = ["wyrd*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"
